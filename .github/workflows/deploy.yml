
name: Test Secure AWS Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test-aws-connection:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Debug OIDC claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const claims = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );
            core.info(`OIDC subject: ${claims.sub}`);
            core.info(`OIDC audience: ${JSON.stringify(claims.aud)}`);

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Create harmless test artifact
        run: |
          set -eu
          mkdir test-release
          echo "SSM S3 connectivity test" > test-release/test.txt
          tar -czf release.tar.gz -C test-release .

      - name: Upload test artifact to private S3
        run: |
          aws s3 cp release.tar.gz \
            "s3://${{ vars.DEPLOY_BUCKET }}/releases/${GITHUB_SHA}.tar.gz"

      - name: Validate artifact through SSM
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail

          COMMAND_ID=$(aws ssm send-command \
            --region "$REGION" \
            --instance-ids "$INSTANCE_ID" \
            --document-name MyAppDeploy \
            --parameters "ReleaseKey=releases/${GITHUB_SHA}.tar.gz" \
            --comment "GitHub OIDC and SSM connectivity test" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for attempt in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --region "$REGION" \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || true)

            case "$STATUS" in
              Success)
                echo "AWS authentication, S3 upload and SSM validation succeeded."
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation \
                  --region "$REGION" \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID"
                exit 1
                ;;
            esac

            sleep 5
          done

          echo "Timed out waiting for SSM."
          exit 1
