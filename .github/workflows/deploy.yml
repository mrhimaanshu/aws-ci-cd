
name: Diagnose GitHub OIDC

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  diagnose-oidc:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Print OIDC subject and audience only
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const claims = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );
            core.info(`OIDC subject: ${claims.sub}`);
            core.info(`OIDC audience: ${JSON.stringify(claims.aud)}`);
